<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultimate Karate Fighter Anime Edition</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
overflow:hidden;
background:black;
font-family:Arial;
}

canvas{
display:block;
background:black;
}

#menu{
position:absolute;
inset:0;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
background:rgba(0,0,0,0.92);
color:white;
z-index:10;
text-align:center;
}

button{
padding:16px 40px;
font-size:24px;
border:none;
border-radius:12px;
background:orange;
cursor:pointer;
font-weight:bold;
margin-top:20px;
}

button:hover{
transform:scale(1.05);
}
</style>
</head>

<body>

<div id="menu">
<h1 style="font-size:70px;color:orange;">
⚔ KARATE FIGHTER ⚔
</h1>

<p style="font-size:24px;margin-top:20px;">
Ultimate Anime Power Edition
</p>

<button onclick="startGame()">
START GAME
</button>
</div>

<canvas id="game"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

window.addEventListener("resize",()=>{
canvas.width = innerWidth;
canvas.height = innerHeight;
});

let gravity = 0.8;
let gameStarted = false;

let score = 0;
let level = 1;

let particles = [];
let screenShake = 0;

let keys = {};

let rageMode = false;
let teleportCooldown = 0;

let ultraInstinct = false;
let ultraTimer = 0;

let kameCooldown = 0;

let spiritBombActive = false;
let spiritBombSize = 0;

window.addEventListener("keydown",(e)=>{
keys[e.key.toLowerCase()] = true;
});

window.addEventListener("keyup",(e)=>{
keys[e.key.toLowerCase()] = false;
});

class Particle{

constructor(x,y,color){

this.x=x;
this.y=y;

this.dx=(Math.random()-0.5)*6;
this.dy=(Math.random()-0.5)*6;

this.size=Math.random()*5+2;

this.color=color;
}

update(){

this.x+=this.dx;
this.y+=this.dy;

this.size*=0.95;

ctx.fillStyle=this.color;

ctx.beginPath();
ctx.arc(this.x,this.y,this.size,0,Math.PI*2);
ctx.fill();
}
}

function hitEffect(x,y,color){

for(let i=0;i<10;i++){
particles.push(new Particle(x,y,color));
}

screenShake = 8;
}

class Fighter{

constructor(x,color){

this.x=x;
this.y=canvas.height-220;

this.w=80;
this.h=140;

this.color=color;

this.velY=0;
this.speed=0;

this.health=100;
this.energy=100;

this.jump=false;

this.attack=false;
this.block=false;
this.power=false;
}

update(){

this.x += this.speed;
this.y += this.velY;

if(this.y + this.h < canvas.height-40){

this.velY += gravity;

}else{

this.velY = 0;
this.jump = false;
this.y = canvas.height-220;
}

this.draw();
}

draw(){

ctx.save();

ctx.strokeStyle=this.color;
ctx.lineWidth=6;

ctx.shadowBlur=12;
ctx.shadowColor=this.color;

ctx.beginPath();
ctx.arc(this.x+40,this.y-20,20,0,Math.PI*2);
ctx.stroke();

ctx.beginPath();
ctx.moveTo(this.x+40,this.y);
ctx.lineTo(this.x+40,this.y+70);
ctx.stroke();

ctx.beginPath();
ctx.moveTo(this.x+10,this.y+30);
ctx.lineTo(this.x+70,this.y+30);
ctx.stroke();

ctx.beginPath();
ctx.moveTo(this.x+40,this.y+70);
ctx.lineTo(this.x+15,this.y+120);
ctx.stroke();

ctx.beginPath();
ctx.moveTo(this.x+40,this.y+70);
ctx.lineTo(this.x+65,this.y+120);
ctx.stroke();

if(this.attack){

ctx.fillStyle='yellow';

ctx.fillRect(
this.x+this.w,
this.y+40,
50,
20
);
}

if(this.block){

ctx.strokeStyle='cyan';

ctx.beginPath();

ctx.arc(
this.x+40,
this.y+50,
75,
0,
Math.PI*2
);

ctx.stroke();
}

if(this.power){

ctx.fillStyle='orange';

ctx.beginPath();

ctx.arc(
this.x+140,
this.y+50,
25,
0,
Math.PI*2
);

ctx.fill();
}

ctx.restore();
}
}

const player = new Fighter(150,"deepskyblue");
const enemy = new Fighter(canvas.width-250,"crimson");

class DragonBall{

constructor(){
this.reset();
}

reset(){

this.x=Math.random()*(canvas.width-200)+100;
this.y=Math.random()*(canvas.height-300)+100;

this.size=18;
this.collected=false;
}

draw(){

ctx.save();

ctx.fillStyle="orange";

ctx.beginPath();
ctx.arc(this.x,this.y,this.size,0,Math.PI*2);
ctx.fill();

ctx.fillStyle="red";

for(let i=0;i<5;i++){

ctx.beginPath();

ctx.arc(
this.x + Math.cos(i)*7,
this.y + Math.sin(i)*7,
2,
0,
Math.PI*2
);

ctx.fill();
}

ctx.restore();
}

update(){

if(this.collected) return;

this.draw();

if(
player.x < this.x+20 &&
player.x+player.w > this.x-20 &&
player.y < this.y+20 &&
player.y+player.h > this.y-20
){

this.collected=true;

score += 100;

player.energy += 15;

hitEffect(this.x,this.y,"gold");
}
}
}

class Kamehameha{

constructor(){

this.x = player.x + 100;
this.y = player.y + 40;

this.speed = 18;

this.active = true;
}

update(){

this.x += this.speed;

ctx.save();

ctx.fillStyle = "cyan";

ctx.shadowBlur = 30;
ctx.shadowColor = "cyan";

ctx.fillRect(this.x,this.y,160,24);

ctx.restore();

if(this.x > canvas.width){
this.active = false;
}

if(
this.x + 160 > enemy.x &&
this.x < enemy.x + enemy.w
){

enemy.health -= 10;

score += 50;

hitEffect(enemy.x,enemy.y,"cyan");

this.active = false;
}
}
}

let dragonBalls = [];
let kamehamehas = [];

for(let i=0;i<7;i++){
dragonBalls.push(new DragonBall());
}

function startGame(){

gameStarted = true;

document.getElementById("menu").style.display = "none";
}

function createLightning(){

ctx.save();

ctx.strokeStyle="cyan";
ctx.lineWidth=5;

ctx.beginPath();

ctx.moveTo(player.x+40,0);
ctx.lineTo(player.x+80,200);
ctx.lineTo(player.x+20,400);

ctx.stroke();

ctx.restore();

enemy.health -= 0.5;
}

function createClone(){

ctx.save();

ctx.globalAlpha = 0.3;

ctx.strokeStyle = "white";
ctx.lineWidth = 5;

ctx.beginPath();

ctx.arc(
player.x-40,
player.y-20,
20,
0,
Math.PI*2
);

ctx.stroke();

ctx.restore();
}

function drawUltraInstinct(){

ctx.save();

ctx.strokeStyle = "white";

ctx.shadowBlur = 40;
ctx.shadowColor = "cyan";

for(let i=0;i<3;i++){

ctx.beginPath();

ctx.arc(
player.x+40,
player.y+40,
80+i*12,
0,
Math.PI*2
);

ctx.stroke();
}

ctx.restore();
}

function drawSpiritBomb(){

if(!spiritBombActive) return;

ctx.save();

ctx.fillStyle = "deepskyblue";

ctx.shadowBlur = 50;
ctx.shadowColor = "white";

ctx.beginPath();

ctx.arc(
player.x+40,
player.y-120,
spiritBombSize,
0,
Math.PI*2
);

ctx.fill();

ctx.restore();

spiritBombSize += 1.5;

if(spiritBombSize > 120){

enemy.health -= 40;

score += 300;

hitEffect(enemy.x,enemy.y,"white");

spiritBombActive = false;

spiritBombSize = 0;
}
}

function controls(){

player.speed = 0;
player.attack = false;
player.block = false;
player.power = false;

if(keys["a"]){
player.speed = -6;
}

if(keys["d"]){
player.speed = 6;
}

if(keys["w"] && !player.jump){

player.velY = -15;
player.jump = true;
}

if(keys[" "]){

player.attack = true;

if(
player.x + 140 > enemy.x &&
player.x < enemy.x
){

enemy.health -= rageMode ? 1 : 0.5;

score += 1;

hitEffect(enemy.x,enemy.y,"orange");
}
}

if(keys["shift"]){

player.block = true;
}

if(keys["e"] && player.energy > 0){

player.power = true;

player.energy -= 0.4;

if(player.x + 260 > enemy.x){

enemy.health -= 1;

score += 3;

hitEffect(enemy.x,enemy.y,"yellow");
}
}

if(keys["q"] && teleportCooldown <= 0){

player.x += 120;

teleportCooldown = 60;

hitEffect(player.x,player.y,"cyan");
}

if(keys["r"] && player.energy > 50){

rageMode = true;

player.energy -= 0.2;
}

if(keys["f"]){

enemy.health -= 0.8;

player.velY = -10;

hitEffect(enemy.x,enemy.y,"orange");

score += 5;
}

if(keys["z"]){

createLightning();
}

if(keys["x"]){

createClone();
}

if(keys["v"] && player.energy >= 20 && kameCooldown <= 0){

kamehamehas.push(new Kamehameha());

player.energy -= 20;

kameCooldown = 40;
}

if(keys["b"] && player.energy >= 80 && !spiritBombActive){

player.energy -= 80;

spiritBombActive = true;

spiritBombSize = 20;
}

if(keys["c"] && player.energy >= 100){

ultraInstinct = true;

ultraTimer = 600;

player.energy = 0;
}
}

function enemyAI(){

let speed = 2 + level*0.3;

if(enemy.x > player.x + 120){
enemy.x -= speed;
}

if(enemy.x < player.x - 120){
enemy.x += speed;
}

if(Math.abs(enemy.x-player.x)<100){

if(!player.block){

player.health -= 0.08 + level*0.03;

hitEffect(player.x,player.y,"red");
}
}
}

function drawBackground(){

ctx.fillStyle="#050510";
ctx.fillRect(0,0,canvas.width,canvas.height);

for(let i=0;i<25;i++){

ctx.fillStyle="white";

ctx.fillRect(
Math.random()*canvas.width,
Math.random()*canvas.height,
2,
2
);
}

ctx.fillStyle="green";

ctx.fillRect(
0,
canvas.height-40,
canvas.width,
40
);
}

function drawBars(){

ctx.fillStyle="red";
ctx.fillRect(40,40,300,30);

ctx.fillStyle="lime";
ctx.fillRect(40,40,player.health*3,30);

ctx.fillStyle="red";
ctx.fillRect(canvas.width-340,40,300,30);

ctx.fillStyle="cyan";
ctx.fillRect(canvas.width-340,40,enemy.health*2,30);

ctx.fillStyle="purple";
ctx.fillRect(40,80,player.energy*3,15);
}

function drawText(){

ctx.fillStyle="white";

ctx.font="28px Arial";

ctx.fillText("Score: "+score,40,140);
ctx.fillText("Level: "+level,40,180);

ctx.fillStyle="gold";

ctx.fillText(
"Dragon Balls: "+
dragonBalls.filter(b=>b.collected).length+"/7",
40,
220
);

ctx.font="18px Arial";

ctx.fillStyle="white";

ctx.fillText("A/D Move",40,canvas.height-160);
ctx.fillText("W Jump",40,canvas.height-130);
ctx.fillText("SPACE Punch",40,canvas.height-100);

ctx.fillText("E Blast",220,canvas.height-160);
ctx.fillText("SHIFT Shield",220,canvas.height-130);
ctx.fillText("Q Teleport",220,canvas.height-100);

ctx.fillText("R Rage",420,canvas.height-160);
ctx.fillText("F Dragon Punch",420,canvas.height-130);
ctx.fillText("Z Lightning",420,canvas.height-100);

ctx.fillStyle="cyan";

ctx.fillText("X Clone",700,canvas.height-160);
ctx.fillText("C Ultra Instinct",700,canvas.height-130);
ctx.fillText("V Kamehameha",700,canvas.height-100);

ctx.fillStyle="deepskyblue";

ctx.fillText("B Spirit Bomb",980,canvas.height-160);
}

function gameOver(text){

ctx.fillStyle="white";

ctx.font="70px Arial";

ctx.fillText(
text,
canvas.width/2-220,
canvas.height/2
);

ctx.font="30px Arial";

ctx.fillText(
"Refresh Page To Restart",
canvas.width/2-170,
canvas.height/2+60
);
}

function nextLevel(){

level++;

enemy.health = 100 + level*25;

enemy.x = canvas.width-250;

player.health = 100;

player.energy = 100;

if(level % 5 === 0){

enemy.health += 150;
}
}

function animate(){

requestAnimationFrame(animate);

if(!gameStarted) return;

ctx.clearRect(0,0,canvas.width,canvas.height);

if(screenShake > 0){

ctx.save();

ctx.translate(
(Math.random()-0.5)*screenShake,
(Math.random()-0.5)*screenShake
);

screenShake--;
}

drawBackground();

dragonBalls.forEach(ball=>{
ball.update();
});

controls();

kamehamehas.forEach((k,index)=>{

k.update();

if(!k.active){
kamehamehas.splice(index,1);
}
});

drawSpiritBomb();

if(kameCooldown > 0){
kameCooldown--;
}

enemyAI();

if(rageMode){

ctx.save();

ctx.strokeStyle="orange";

ctx.shadowBlur=30;
ctx.shadowColor="orange";

ctx.beginPath();

ctx.arc(
player.x+40,
player.y+40,
90,
0,
Math.PI*2
);

ctx.stroke();

ctx.restore();
}

if(ultraInstinct){

drawUltraInstinct();

player.speed *= 1.8;

if(Math.abs(player.x-enemy.x)<180){

enemy.health -= 0.3;

hitEffect(enemy.x,enemy.y,"white");
}

ultraTimer--;

if(ultraTimer <= 0){

ultraInstinct = false;
}
}

player.update();
enemy.update();

particles.forEach((p,index)=>{

p.update();

if(p.size < 0.5){

particles.splice(index,1);
}
});

if(player.x < 0){
player.x = 0;
}

if(player.x > canvas.width-player.w){
player.x = canvas.width-player.w;
}

if(teleportCooldown > 0){
teleportCooldown--;
}

if(player.energy < 100){
player.energy += 0.05;
}

drawBars();
drawText();

if(player.health <= 0){

gameOver("GAME OVER");

return;
}

if(enemy.health <= 0){

if(dragonBalls.every(ball=>ball.collected)){

player.health = 100;
player.energy = 100;

score += 1000;

ctx.fillStyle="gold";
ctx.font="60px Arial";

ctx.fillText(
"SHENRON POWER!",
canvas.width/2-250,
150
);

dragonBalls = [];

for(let i=0;i<7;i++){
dragonBalls.push(new DragonBall());
}
}

nextLevel();
}

if(screenShake > 0){
ctx.restore();
}
}

animate();

</script>

</body>
</html>
